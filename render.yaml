services:
  - type: web
    name: bypassx-discord-bot
    runtime: python
    buildCommand: pip install -r requirements-bot.txt
    startCommand: python -m discord_bot.bot
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: BYPASS_API_URL
        value: https://bypassx-bpzt.onrender.com
      - key: BYPASS_FALLBACK_API_URL
        value: https://usebypas.com/api/v1/bypass
      - key: BYPASS_CROWD_API_URL
        value: https://crowd.fastforward.team/crowd/query_v1
      - key: BYPASS_FALLBACK_TIMEOUT
        value: "120"
      - key: DISCORD_PREFIX
        value: "+"
      - key: BYPASS_API_TIMEOUT
        value: "75"
      - key: AUTO_BYPASS_CONFIG
        value: data/auto_channels.json
      - key: DISCORD_GUILD_ID
        sync: false
      - key: BOT_OWNER_IDS
        sync: false
      - key: BYPASS_USER_COOLDOWN
        value: "5"
      - key: BYPASS_GUILD_COOLDOWN
        value: "2"
      - key: BYPASS_MAX_CONCURRENT
        value: "3"
